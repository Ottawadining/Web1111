<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ottawa's Top 10 Restaurants · 2026</title>
<meta name="description" content="Ottawa's 10 best restaurants for 2026, revealed from No. 10 to No. 1.">
<meta property="og:title" content="Ottawa's Top 10 Restaurants · 2026">
<meta property="og:description" content="Ottawa's 10 best restaurants for 2026, revealed from No. 10 to No. 1.">
<meta property="og:url" content="https://ottawatop10.com/">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Ottawa's Top 10 Restaurants 2026",
  "itemListOrder": "https://schema.org/ItemListOrderAscending",
  "numberOfItems": 10,
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "item": {"@type": "Restaurant", "name": "Atelier", "url": "https://www.atelierrestaurant.ca/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 2, "item": {"@type": "Restaurant", "name": "Antheia", "url": "https://www.exploretock.com/antheia", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 3, "item": {"@type": "Restaurant", "name": "Stofa", "url": "https://www.stofarestaurant.com/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 4, "item": {"@type": "Restaurant", "name": "Raphaël", "url": "https://www.raphaelperuviancuisine.ca/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 5, "item": {"@type": "Restaurant", "name": "Gitanes", "url": "https://www.gitanes.co/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 6, "item": {"@type": "Restaurant", "name": "Fauna", "url": "https://www.faunaottawa.ca/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 7, "item": {"@type": "Restaurant", "name": "Supply & Demand", "url": "https://supplyanddemandfoods.ca/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 8, "item": {"@type": "Restaurant", "name": "Beckta", "url": "https://www.beckta.com/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 9, "item": {"@type": "Restaurant", "name": "Town", "url": "https://www.townlovesyou.ca/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}},
    {"@type": "ListItem", "position": 10, "item": {"@type": "Restaurant", "name": "Aiana", "url": "https://aiana.ca/", "address": {"@type": "PostalAddress", "addressLocality": "Ottawa", "addressRegion": "ON", "addressCountry": "CA"}}}
  ]
}
</script>

<style>
  :root {
    --gold: #c9a96e;
    --ink: #f3eee6;
    --mute: rgba(243, 238, 230, 0.62);
    --faint: rgba(243, 238, 230, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }

  #stage {
    position: fixed; inset: 0; cursor: pointer; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Intro ---------- */
  #intro {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    transition: opacity 1.4s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .eyebrow, #intro .title, #intro .year, #intro .begin {
    opacity: 0; transform: translateY(10px);
    animation: rise 1.8s ease forwards;
  }
  #intro .eyebrow {
    font-size: clamp(14px, 1.6vw, 18px); letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--mute); animation-delay: 0.4s;
  }
  #intro .title {
    font-weight: 300; font-size: clamp(46px, 9vw, 120px); line-height: 0.98;
    margin: 0.22em 0 0.18em; letter-spacing: -0.01em; animation-delay: 1.1s;
  }
  #intro .year {
    font-style: italic; color: var(--gold); font-size: clamp(22px, 3vw, 34px);
    animation-delay: 1.9s;
  }
  #intro .begin {
    margin-top: 9vh; font-size: 14px; letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--mute); animation: rise 1.8s ease 3s forwards, breathe 3.6s ease-in-out 4.8s infinite;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---------- Slides ---------- */
  .slide {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .slide.on { opacity: 1; transition-duration: 1.6s; }
  .photo {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    background-repeat: no-repeat; will-change: transform;
  }
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.35) 42%, rgba(0,0,0,0.08) 75%),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
  }
  .caption {
    position: absolute; left: clamp(24px, 7vw, 104px); right: 24px;
    bottom: calc(clamp(72px, 13vh, 130px) + env(safe-area-inset-bottom));
  }
  .num {
    font-style: italic; color: var(--gold); font-size: clamp(26px, 3.6vw, 42px);
    opacity: 0; transform: translateY(10px);
    transition: opacity 1.2s ease, transform 1.8s ease;
  }
  .name {
    font-weight: 400; font-size: clamp(46px, 8.4vw, 112px); line-height: 0.98;
    margin: 0.08em 0 0.22em; letter-spacing: -0.012em;
    opacity: 0; transform: translateY(16px);
    transition: opacity 1.5s ease, transform 2.2s ease;
  }
  .line {
    margin: 0; max-width: 30em; font-size: clamp(18px, 2vw, 23px); color: var(--mute);
    opacity: 0; transform: translateY(12px);
    transition: opacity 1.5s ease 0.35s, transform 2.2s ease 0.35s;
  }
  .slide.num-on .num { opacity: 1; transform: none; }
  .slide.name-on .name, .slide.name-on .line { opacity: 1; transform: none; }

  /* ---------- Progress ticks ---------- */
  #ticks {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(26px + env(safe-area-inset-bottom));
    display: flex; gap: 7px; opacity: 0; transition: opacity 1s ease; pointer-events: none;
  }
  #ticks.show { opacity: 1; }
  #ticks span { width: 18px; height: 2px; background: var(--faint); transition: background 0.8s ease; }
  #ticks span.done { background: var(--gold); }

  /* ---------- End / full list ---------- */
  #end {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #000; opacity: 0; visibility: hidden; cursor: default;
    transition: opacity 1.4s ease, visibility 0s linear 1.4s;
  }
  #end.show { opacity: 1; visibility: visible; transition: opacity 1.4s ease, visibility 0s; }
  .end-inner {
    max-width: 760px; margin: 0 auto;
    padding: clamp(56px, 12vh, 120px) 24px calc(64px + env(safe-area-inset-bottom));
  }
  .end-inner .eyebrow {
    font-size: 14px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--mute);
  }
  .end-inner h1 {
    font-weight: 300; font-size: clamp(40px, 7vw, 76px); line-height: 1;
    margin: 0.25em 0 0.15em; letter-spacing: -0.01em;
  }
  .end-inner .year { font-style: italic; color: var(--gold); font-size: 24px; }
  .list { list-style: none; margin: 48px 0 0; padding: 0; border-top: 1px solid var(--faint); }
  .list li { border-bottom: 1px solid var(--faint); }
  .list li > a:first-child {
    display: grid; grid-template-columns: 3.2rem 1fr; align-items: baseline; gap: 0 12px;
    padding: 20px 0; color: inherit; text-decoration: none;
  }
  .list .r { font-style: italic; color: var(--gold); font-size: 26px; }
  .list .n { font-size: clamp(26px, 4vw, 34px); line-height: 1.1; }
  .list .d { grid-column: 2; color: var(--mute); font-size: 18px; margin-top: 4px; }
  .list a:hover .n { color: var(--gold); }
  .list li > a:first-child { padding-bottom: 8px; }
  .list .site {
    display: inline-block; margin: 0 0 20px calc(3.2rem + 12px);
    font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--faint); padding-bottom: 3px;
  }
  .list .site:hover { color: var(--gold); border-color: var(--gold); }
  .actions { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-top: 44px; }
  .actions a, .actions button {
    font: inherit; font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .num, .name, .line, #intro .eyebrow, #intro .title, #intro .year, #intro .begin {
      transform: none !important;
    }
    #intro .begin { animation: rise 1.2s ease 2s forwards; }
  }
</style>
</head>
<body>

<div id="stage" aria-live="polite">
  <div id="intro">
    <div class="eyebrow">Ottawa's</div>
    <div class="title">10 Best<br>Restaurants</div>
    <div class="year">2026</div>
    <div class="begin">Tap to begin</div>
  </div>
  <!-- slides are inserted here -->
</div>

<div id="ticks" aria-hidden="true"></div>

<section id="end" aria-label="Ottawa's Top 10 Restaurants 2026">
  <div class="end-inner">
    <div class="eyebrow">Ottawa's</div>
    <h1>Top 10 Restaurants</h1>
    <div class="year">2026</div>
    <ul class="list" id="list"></ul>
    <div class="actions">
      <button type="button" id="replay">Watch again</button>
      <a href="https://ottawatop50.com/">See the Top 50</a>
    </div>
  </div>
</section>

<script>
/* ============================================================
   EDIT HERE
   img  : photo path (falls back to a dark placeholder if missing)
   fx/fy: focal point in % — the zoom pushes toward this spot
   move : "in" | "out" | "left" | "right"
   url  : restaurant website (optional)
   ============================================================ */
const LIST = [
  { rank: 10, name: "Aiana",           line: "Chef Raghav Chaudhary's tasting menus, built on Canadian seafood, game and produce.", img: "10.jpg", fx: 33, fy: 57, move: "in",    url: "https://aiana.ca/" },
  { rank: 9,  name: "Town",            line: "Italian-inspired comfort on Elgin since 2010, cooked with real generosity.", img: "09.jpg", fx: 50, fy: 45, move: "left",  url: "https://www.townlovesyou.ca/" },
  { rank: 8,  name: "Beckta",          line: "Stephen Beckta's flagship, setting the standard for polished dining in Ottawa since 2003.", img: "08.jpg", fx: 72, fy: 46, move: "out",   url: "https://www.beckta.com/" },
  { rank: 7,  name: "Supply & Demand", line: "Wellington West's raw bar and pasta destination, from crudo to squid ink rigatoni.", img: "07.jpg", fx: 33, fy: 52, move: "in",    url: "https://supplyanddemandfoods.ca/" },
  { rank: 6,  name: "Fauna",           line: "Seasonal small plates on Bank Street, and a bison tartare regulars keep coming back for.", img: "06.jpg", fx: 48, fy: 45, move: "right", url: "https://www.faunaottawa.ca/" },
  { rank: 5,  name: "Gitanes",         line: "French cooking with Canadian ingredients, a raw bar and a serious wine cellar, tucked off Elgin.", img: "05.jpg", fx: 45, fy: 64, move: "in",    url: "https://www.gitanes.co/" },
  { rank: 4,  name: "Raphaël",         line: "Chef Lizardo Becerra's Peruvian cooking, refined into plates made for sharing.", img: "04.jpg", fx: 47, fy: 42, move: "out",   url: "https://www.raphaelperuviancuisine.ca/" },
  { rank: 3,  name: "Stofa",           line: "Chef Jason Sawision's approachable fine dining in a calm, Nordic-inspired room in Wellington West.", img: "03.jpg", fx: 45, fy: 55, move: "left",  url: "https://www.stofarestaurant.com/" },
  { rank: 2,  name: "Antheia",         line: "Chef Briana Kim's intimate counter, where fermentation drives every course.", img: "02.jpg", fx: 50, fy: 62, move: "in",    url: "https://www.exploretock.com/antheia" },
  { rank: 1,  name: "Atelier",         line: "A long, playful tasting menu from Ottawa's most inventive kitchen.", img: "01.jpg", fx: 42, fy: 55, move: "in",    url: "https://www.atelierrestaurant.ca/" }
];

/* Timing (ms) */
const FADE_IN = 1600, FADE_OUT = 1200, GAP = 350;
const holdFor = r => r === 1 ? 10000 : r <= 3 ? 7500 : 6000;
const nameDelay = r => r === 1 ? 3600 : 1400;

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const intro = document.getElementById('intro');
const ticksEl = document.getElementById('ticks');
const endEl = document.getElementById('end');
const listEl = document.getElementById('list');

const PLACEHOLDER = 'radial-gradient(ellipse at 38% 42%, #2b241b 0%, #120f0b 55%, #050404 100%)';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function motion(d) {
  const o = `${d.fx}% ${d.fy}%`;
  const dx = 1.6;
  switch (d.move) {
    case 'out':   return { o, from: 'scale(1.09)', to: 'scale(1)' };
    case 'left':  return { o, from: `scale(1.07) translateX(${dx}%)`,  to: `scale(1.07) translateX(-${dx}%)` };
    case 'right': return { o, from: `scale(1.07) translateX(-${dx}%)`, to: `scale(1.07) translateX(${dx}%)` };
    default:      return { o, from: 'scale(1)', to: 'scale(1.09)' };
  }
}

/* Build slides, ticks and the full list */
const slides = LIST.map(d => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.innerHTML =
    `<div class="photo"></div><div class="shade"></div>
     <div class="caption">
       <div class="num">No. ${d.rank}</div>
       <h2 class="name">${esc(d.name)}</h2>
       <p class="line">${esc(d.line)}</p>
     </div>`;
  const photo = el.querySelector('.photo');
  photo.style.backgroundImage = `url("${d.img}"), ${PLACEHOLDER}`;
  photo.style.transformOrigin = motion(d).o;
  photo.style.backgroundPosition = motion(d).o;
  stage.appendChild(el);
  const pre = new Image(); pre.src = d.img;
  return { el, photo };
});

LIST.forEach(() => ticksEl.appendChild(document.createElement('span')));

LIST.slice().sort((a, b) => a.rank - b.rank).forEach(d => {
  const i = LIST.indexOf(d);
  const li = document.createElement('li');
  li.innerHTML =
    `<a href="#${d.rank}" data-i="${i}">
       <span class="r">${d.rank}</span>
       <span class="n">${esc(d.name)}</span>
       <span class="d">${esc(d.line)}</span>
     </a>` +
    (d.url ? `<a class="site" href="${esc(d.url)}" target="_blank" rel="noopener">Visit site</a>` : '');
  listEl.appendChild(li);
});

/* Playback */
let idx = -1, started = false, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function setTicks(i) {
  [...ticksEl.children].forEach((t, j) => t.classList.toggle('done', j <= i));
}

function hideSlide(s) { s.el.classList.remove('on', 'num-on', 'name-on'); }

function show(i) {
  clearTimers();
  slides.forEach((s, j) => { if (j !== i) hideSlide(s); });
  if (i >= LIST.length) return finish();

  idx = i;
  const d = LIST[i], s = slides[i], m = motion(d), hold = holdFor(d.rank);
  endEl.classList.remove('show');
  ticksEl.classList.add('show');
  setTicks(i);
  try { history.replaceState(null, '', '#' + d.rank); } catch (e) {}

  hideSlide(s);
  s.photo.getAnimations().forEach(a => a.cancel());
  void s.el.offsetWidth;
  if (!reduce) {
    s.photo.animate([{ transform: m.from }, { transform: m.to }],
      { duration: hold + FADE_OUT + 200, easing: 'linear', fill: 'both' });
  }
  s.el.classList.add('on');
  later(() => s.el.classList.add('num-on'), 300);
  later(() => s.el.classList.add('name-on'), nameDelay(d.rank));
  later(() => { hideSlide(s); later(() => show(i + 1), FADE_OUT + GAP); }, hold);
}

function finish() {
  idx = LIST.length;
  ticksEl.classList.remove('show');
  endEl.scrollTop = 0;
  endEl.classList.add('show');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

function start(i) {
  started = true;
  intro.classList.add('gone');
  later(() => show(i), 900);
}

/* Deep link: ottawatop10.com/#7 starts the reveal at No. 7 */
function hashIndex() {
  const r = parseInt(location.hash.slice(1), 10);
  const i = LIST.findIndex(d => d.rank === r);
  return i < 0 ? 0 : i;
}

/* Controls: tap right two-thirds = next, left third = back */
stage.addEventListener('click', e => {
  if (!started) return start(hashIndex());
  if (idx < 0 || idx >= LIST.length) return;
  if (e.clientX < window.innerWidth / 3) show(Math.max(idx - 1, 0));
  else show(idx + 1);
});

document.addEventListener('keydown', e => {
  if (endEl.classList.contains('show')) return;
  if (!started && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight')) {
    e.preventDefault(); return start(hashIndex());
  }
  if (!started || idx < 0) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(idx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(Math.max(idx - 1, 0)); }
});

document.getElementById('replay').addEventListener('click', () => show(0));
listEl.addEventListener('click', e => {
  const a = e.target.closest('a[data-i]');
  if (!a) return;
  e.preventDefault();
  show(+a.dataset.i);
});
</script>
</body>
</html>
